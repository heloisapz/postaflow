version: '3.8'

services:
  # ==========================================
  # INFRAESTRUTURA BASE
  # ==========================================
  
  zookeeper:
    image: zookeeper:3.8
    container_name: zoo
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit
    ports:
      - "5672:5672"   
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_smtp
    ports:
      - "1025:1025" 
      - "8025:8025" 

 # ==========================================
  # APLICAÇÕES (Escaladas)
  # ==========================================

  nginx:
    image: nginx:latest
    container_name: load_balancer
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    deploy:
      replicas: 3
    environment:
      - RABBITMQ_HOST=rabbitmq
      - ZOOKEEPER_HOST=zookeeper:2181
    depends_on:
      zookeeper:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    deploy:
      replicas: 3 
    environment:
      - BACKEND_URL=http://nginx/api/enviar
    depends_on:
      - backend

  consumer:
    build: ./consumer
    deploy:
      replicas: 2
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MAILHOG_HOST=mailhog
      - MAILHOG_PORT=1025
    depends_on:
      rabbitmq:
        condition: service_healthy