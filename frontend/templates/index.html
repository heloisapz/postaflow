<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:      #0F1217;
      --ink-2:    #3A3F4A;
      --ink-3:    #7A8090;
      --paper:    #F5F2ED;
      --paper-2:  #EDE9E2;
      --paper-3:  #E0DBCF;
      --blue:     #1A4FCC;
      --blue-2:   #0D3B9E;
      --blue-pale:#D6E1F8;
      --red-pale: #FAE8E8;
      --green-pale:#E6F5EF;
      --serif:    'DM Serif Display', Georgia, serif;
      --sans:     'DM Sans', system-ui, sans-serif;
      --radius:   12px;
      --transition: 0.18s ease;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      min-height: 600px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--paper-3);
    }

    .left {
      background: var(--ink);
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .left::after {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .left::before {
      content: '';
      position: absolute;
      bottom: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-dot svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-name { font-family: var(--serif); font-size: 18px; color: #fff; letter-spacing: -0.01em; }

    .left-headline {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 0;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--blue-pale);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1px;
      background: var(--blue-pale);
    }
    .headline {
      font-family: var(--serif);
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      line-height: 1.08;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .headline em {
      font-style: italic;
      color: var(--blue-pale);
    }
    .left-desc {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(255,255,255,0.45);
      max-width: 260px;
    }

    .right {
      background: var(--paper);
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-title {
      font-family: var(--serif);
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }
    .form-sub {
      font-size: 13px;
      color: var(--ink-3);
      margin-bottom: 2rem;
    }

    .field { margin-bottom: 1.1rem; }

    .label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .label svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

    .input-wrap { position: relative; }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--paper-2);
      border: 1px solid var(--paper-3);
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: var(--ink-3); }
    input:focus, textarea:focus {
      background: #fff;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26,79,204,0.10);
    }
    textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

    .char-count {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 11px;
      color: var(--ink-3);
      pointer-events: none;
      transition: color var(--transition);
    }
    .char-count.warn { color: #CC4400; }

    .divider {
      border: none;
      border-top: 1px solid var(--paper-3);
      margin: 1.5rem 0 1.25rem;
    }

    .btn-send {
      width: 100%;
      padding: 12px 20px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: background var(--transition), transform var(--transition);
      letter-spacing: 0.01em;
    }
    .btn-send svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--transition); }
    .btn-send:hover { background: var(--blue-2); }
    .btn-send:hover svg { transform: translateX(2px) translateY(-2px); }
    .btn-send:active { transform: scale(0.985); }
    .btn-send:disabled { background: var(--paper-3); color: var(--ink-3); cursor: not-allowed; transform: none; }
    .btn-send:disabled svg { stroke: var(--ink-3); }

    .status {
      margin-top: 0.85rem;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 18px;
      border-radius: 8px;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s;
      opacity: 0;
    }
    .status.visible {
      max-height: 60px;
      opacity: 1;
      padding: 8px 12px;
    }
    .status.success { background: var(--green-pale); color: #0D6E3A; }
    .status.error   { background: var(--red-pale);   color: #A32020; }
    .status.loading { background: var(--paper-2);    color: var(--ink-3); padding: 0 !important; }
    .status svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; stroke-linecap: round; stroke-linejoin: round; }

    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-up {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.5s ease forwards;
    }
    .fade-up:nth-child(1) { animation-delay: 0.05s; }
    .fade-up:nth-child(2) { animation-delay: 0.12s; }
    .fade-up:nth-child(3) { animation-delay: 0.19s; }
    .fade-up:nth-child(4) { animation-delay: 0.26s; }
    .fade-up:nth-child(5) { animation-delay: 0.33s; }
    .fade-up:nth-child(6) { animation-delay: 0.40s; }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }

    /* ── Responsivo ── */
    @media (max-width: 680px) {
      .page { grid-template-columns: 1fr; }
      .left { padding: 2rem; }
      .left-headline { padding: 1.5rem 0; }
      .right { padding: 2rem; }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="left">
    <div class="brand">
      <div class="brand-dot">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </div>
      <span class="brand-name">PostaFlow</span>
    </div>

    <div class="left-headline">
      <p class="eyebrow">sistema de envio</p>
      <h1 class="headline">
        Mensagens<br>que chegam<br><em>na hora certa.</em>
      </h1>
      <p class="left-desc">
        Compose, enfileire e monitore seus e-mails com total controle: rápido, simples e confiável.
      </p>
    </div>

  </div>

  <!-- Formulário -->
  <div class="right">
    <p class="form-title fade-up">Novo e-mail</p>
    <p class="form-sub fade-up">Preencha os campos abaixo para enfileirar o envio.</p>

    <div class="field fade-up">
      <div class="label">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Para
      </div>
      <input type="email" id="destinatario" placeholder="destinatario@empresa.com" autocomplete="email">
    </div>

    <div class="field fade-up">
      <div class="label">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        Assunto
      </div>
      <input type="text" id="assunto" placeholder="Assunto do e-mail" maxlength="120">
    </div>

    <div class="field fade-up">
      <div class="label">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Mensagem
      </div>
      <div class="input-wrap">
        <textarea id="mensagem" placeholder="Escreva sua mensagem aqui..." maxlength="2000" oninput="updateCount(this)"></textarea>
        <span class="char-count" id="charCount">0 / 2000</span>
      </div>
    </div>

    <hr class="divider fade-up">

    <button class="btn-send fade-up" id="btnEnviar" onclick="enviarEmail()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Enviar e-mail
    </button>

    <div class="status" id="status"></div>
  </div>

</div>

<script>
  function updateCount(el) {
    const count = document.getElementById('charCount');
    const len = el.value.length;
    count.textContent = len + ' / 2000';
    count.classList.toggle('warn', len > 1800);
  }

  function setStatus(type, svgPath, msg) {
    const s = document.getElementById('status');
    s.className = 'status ' + type + (type === 'loading' ? '' : ' visible');
    s.innerHTML = '<svg viewBox="0 0 24 24" class="' + (type === 'loading' ? 'spin' : '') + '">' + svgPath + '</svg>' + msg;
    if (type === 'loading') {
      setTimeout(() => s.classList.add('visible'), 10);
    }
  }

  async function enviarEmail() {
    const btn = document.getElementById('btnEnviar');
    const dest    = document.getElementById('destinatario').value.trim();
    const assunto = document.getElementById('assunto').value.trim();
    const msg     = document.getElementById('mensagem').value.trim();

    if (!dest || !assunto || !msg) {
      setStatus('error',
        '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
        'Preencha todos os campos antes de enviar.'
      );
      return;
    }

    btn.disabled = true;
    setStatus('loading',
      '<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>',
      'Enviando para a fila...'
    );

    try {
      const res = await fetch('/enviar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ destinatario: dest, assunto, mensagem: msg })
      });
      const json = await res.json();

      if (res.ok) {
        setStatus('success',
          '<polyline points="20 6 9 17 4 12"/>',
          'E-mail adicionado à fila com sucesso!'
        );
        document.querySelectorAll('input, textarea').forEach(el => el.value = '');
        document.getElementById('charCount').textContent = '0 / 2000';
      } else {
        setStatus('error',
          '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
          json.erro || 'Falha ao enviar o e-mail.'
        );
      }
    } catch {
      setStatus('error',
        '<line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>',
        'Sem conexão com o servidor.'
      );
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
